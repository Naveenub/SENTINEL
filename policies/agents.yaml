# Anything not listed is denied. Every tool needs a JSON Schema (validated at startup).
agents:
  research-bot:
    tools:
      web_fetch:
        schema:
          type: object
          properties:
            url: { type: string, pattern: "^https://" }
          required: [url]
          additionalProperties: false
        rate_limit: 30/min
      shell:
        schema:
          type: object
          properties:
            cmd: { type: string, maxLength: 200 }
          required: [cmd]
          additionalProperties: false
        rate_limit: 5/min
        approval: required   # human must approve each call
      summarize_report:
        schema:
          type: object
          properties:
            text: { type: string, maxLength: 10000 }
          required: [text]
          additionalProperties: false
        rate_limit: 10/min
        secrets: [reports:read]     # a short-lived scoped token is injected as SENTINEL_TOKEN
        token_ttl: 30
        sandbox:
          image: python:3.12-slim
          command: ["python", "-c", "import sys; print(sys.stdin.read()[:200])"]
          network: none             # or "proxy" for allowlisted egress
          timeout: 10
          memory: 256m
      fetch_docs:                   # strict variant of web_fetch: every URL must hit an allowed host
        schema:
          type: object
          properties:
            url: { type: string, pattern: "^https://" }
          required: [url]
          additionalProperties: false
        allowed_hosts: [docs.python.org, "*.github.com"]
        rate_limit: 30/min
  garak-target:                     # model-proxy-only agent for garak scans: may call the model, no tools
    tools: {}

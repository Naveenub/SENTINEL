[project]
name = "sentinel"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2", "pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
ml = ["transformers>=4.40", "torch>=2.2"]  # Prompt Guard backend

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sentinel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

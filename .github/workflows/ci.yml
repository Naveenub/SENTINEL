name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: open-policy-agent/setup-opa@v2
        with: { version: "1.21.1" }  # pinned: a new OPA release must not break CI unannounced; bump deliberately
      - run: opa test policies/opa -v
      - run: pip install -e ".[dev]"
      # unit tests + red-team corpus (strict xfails fail the build if a known gap gets fixed: move it to attacks)
      - run: pytest -q -rfEX

  promptfoo:
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 15
    env:
      SENTINEL_AUDIT_KEY: ci-only-audit-key-0123456789abcdef
      SENTINEL_ADMIN_TOKEN: ci-only-admin-token
      SENTINEL_AUDIT_DB: /tmp/ci_audit.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      - name: Start gateway
        run: |
          python -m uvicorn --factory sentinel.main:create_app --port 8080 > /tmp/gateway.log 2>&1 &
          for i in $(seq 30); do
            curl -sf -H "X-Sentinel-Admin-Token: $SENTINEL_ADMIN_TOKEN" localhost:8080/healthz && exit 0
            sleep 1
          done
          echo "gateway did not become healthy in 30s" >&2
          cat /tmp/gateway.log >&2
          exit 1
      - name: Red-team via promptfoo
        run: npx -y promptfoo@0.124.0 eval -c tests/redteam/promptfooconfig.yaml --no-cache

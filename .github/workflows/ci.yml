name: ci
on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      # unit tests + red-team corpus (strict xfails fail the build if a known gap gets fixed: move it to attacks)
      - run: pytest -q -rfEX

  promptfoo:
    runs-on: ubuntu-latest
    needs: tests
    env:
      SENTINEL_AUDIT_KEY: ci-only-audit-key-0123456789abcdef
      SENTINEL_ADMIN_TOKEN: ci-only-admin-token
      SENTINEL_AUDIT_DB: /tmp/ci_audit.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: Start gateway
        run: |
          python -m uvicorn --factory sentinel.main:create_app --port 8080 &
          for i in $(seq 30); do curl -sf localhost:8080/healthz && break; sleep 1; done
      - name: Red-team via promptfoo
        run: npx -y promptfoo@0.124.0 eval -c tests/redteam/promptfooconfig.yaml --no-cache
